name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate content
        run: pnpm content:check --errors-only

      - name: Type check
        run: pnpm exec svelte-check --tsconfig ./tsconfig.json --threshold error

      - name: Build web app
        run: pnpm build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The runner image ships the Android SDK; android-actions/setup-android fails with cmdline-tools 16+.
      - name: Android SDK packages
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.STOLYPIN_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "STOLYPIN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          STOLYPIN_KEYSTORE_PASSWORD: ${{ secrets.STOLYPIN_KEYSTORE_PASSWORD }}
        run: |
          VERSION=$(node -p "require('../package.json').version")
          ./gradlew assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName="$VERSION"
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk "../out/stolypin-$VERSION-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: stolypin-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
